[project]
name = "snip"
version = "0.1.0"
description = "Local-first snippet and thought manager with semantic search"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click==8.1.8",
    "pyperclip==1.9.0",
    "rich==13.9.4",
    "fastembed",
    "sqlite-vec==0.1.9",
    "typer==0.15.2",
]

[project.scripts]
snip = "snip.cli:app"

