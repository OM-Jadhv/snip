[project]
name = "snip"
version = "0.1.0"
description = "Local-first snippet and thought manager with semantic search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyperclip==1.9.0",
    "rich==13.9.4",
    "sentence-transformers==3.4.1",
    "sqlite-vec==0.1.9",
    "typer==0.15.2",
]

[project.scripts]
snip = "snip.cli:app"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
